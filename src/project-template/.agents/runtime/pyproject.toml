[project]
name = "agentic-runtime"
version = "0.1.0"
description = "Central runtime and FastMCP adapter for this project's agentic workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.2,<4",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0,<7",
  "rapidfuzz>=3.14,<4",
  "rich>=14.0,<15",
  "typer>=0.21,<1"
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<1",
  "ruff>=0.15,<1"
]

[project.scripts]
agentic = "agentic_scaffold.cli:main"
agentic-runtime = "agentic_scaffold.cli:main"
agentic-mcp = "agentic_scaffold.cli:main"
agentic-mcp-server = "agentic_scaffold.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_scaffold"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["-q"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
