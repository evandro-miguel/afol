[project]
name = "agents-scripts"
version = "0.1.0"
description = "Operational scripts for .agents system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "responses>=0.24.0",
    "ruff>=0.15.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "-s",
    "--strict-markers",
    "--tb=short",
    "-p",
    "no:cacheprovider",
    "--basetemp=.agents/tmp/pytest-scripts-basetemp",
]
log_file = ".agents/tmp/pytest-scripts.log"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = [".agents/scripts"]
omit = [
    ".agents/scripts/tests/*",
    ".agents/scripts/tests/**",
    "tests/*",
    "*/tests/*",
    "**/tests/*",
    "**/tests/**",
    "**/__pycache__/*",
    "**/.venv/*",
]

[tool.coverage.report]
fail_under = 80
omit = [
    ".agents/scripts/tests/*",
    ".agents/scripts/tests/**",
    "tests/*",
    "*/tests/*",
    "**/tests/*",
    "**/tests/**",
]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C901"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"agents-fix-symlinks.py" = ["C901"]
"agents-new.py" = ["C901"]
"agents-telemetry.py" = ["C901"]
"agents-tools.py" = ["C901"]
"check-links.py" = ["C901"]
"sync-agent-docs.py" = ["C901"]
"verify-tasks.py" = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 12
