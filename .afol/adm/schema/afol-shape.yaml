api_version: "1.0.0"
name: "afol-shape"
version: "1"
page_types:
  - name: "adm"
    prefix: "adm"
    authority: "canonical"
    inclusion: "task-matched"
    stale_policy: "manual"
  - name: "pstr"
    prefix: "pstr"
    authority: "observed"
    inclusion: "surface-matched"
    stale_policy: "rebuild-on-drift"
  - name: "wb"
    prefix: "wb"
    authority: "execution"
    inclusion: "session-matched"
    stale_policy: "session-age"
  - name: "memory"
    prefix: "memory"
    authority: "continuity"
    inclusion: "cited-only"
    stale_policy: "memory-freshness"
  - name: "library"
    prefix: "library"
    authority: "external-knowledge"
    inclusion: "cited-only"
    stale_policy: "reference-freshness"
