name: Release candidate

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    env:
      OSV_SCANNER_VERSION: "2.3.8"
      GITLEAKS_VERSION: "8.24.2"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned security scanners
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/security-tools"
          mkdir -p "$tool_dir"
          export GOBIN="$tool_dir"
          go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@v${OSV_SCANNER_VERSION}"
          go install "github.com/zricethezav/gitleaks/v8@v${GITLEAKS_VERSION}"
          echo "AFOL_OSV_SCANNER_PATH=$tool_dir/osv-scanner" >> "$GITHUB_ENV"
          echo "AFOL_GITLEAKS_PATH=$tool_dir/gitleaks" >> "$GITHUB_ENV"
      - name: Validate exact source and artifact
        run: bun run public:audit -- . && bun run validate:release
      - name: Package Linux x64 assets
        run: |
          set -euo pipefail
          cp dist/afol dist/afol-linux-x64
          sha256sum dist/afol-linux-x64 > dist/afol-linux-x64.sha256
          jq '.artifact = "afol-linux-x64"' dist/afol.provenance.json > dist/afol-linux-x64.provenance.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@57aae528053a48a3f6235f2d9461b05fbcb7366d # v0.23.1
        with:
          file: dist/afol-linux-x64
          format: spdx-json
          output-file: dist/afol-linux-x64.spdx.json
          artifact-name: afol-linux-x64.spdx.json
          upload-release-assets: false
      - name: Attest binary provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/afol-linux-x64
      - name: Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/afol-linux-x64
          sbom-path: dist/afol-linux-x64.spdx.json
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "AFOL $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            dist/afol-linux-x64 \
            dist/afol-linux-x64.sha256 \
            dist/afol-linux-x64.provenance.json \
            dist/afol-linux-x64.spdx.json
