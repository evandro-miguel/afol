name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: "1.3.14"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Validate generated metadata and toolchain
        run: bun run validate:toolchain
      - name: Audit public content and reachable history
        run: bun run public:audit -- .
      - name: Typecheck
        run: bun run typecheck
      - name: Validate project template
        run: bun run validate:template

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: "1.3.14"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run the CI suite
        run: bun run test:ci

  core-smoke:
    name: core-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: "1.3.14"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Validate bootstrap behavior
        run: bun run validate:bootstrap
      - name: Build the CLI
        run: bun run build
      - name: Bind local provenance to the candidate
        run: bun run release:provenance
      - name: Exercise the public example
        run: bun run smoke:example

  deep-validation:
    name: deep-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - tests
      - core-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: "1.3.14"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run the ordered full suite
        run: bun run test:full
      - name: Enforce selected-surface coverage
        run: bun run coverage:check
      - name: Verify the deterministic build
        run: bun run build:deterministic
      - name: Bind distribution provenance
        run: bun run release:provenance
      - name: Smoke the compiled distribution
        run: bun run smoke:dist
      - name: Smoke a clean project
        run: bun run smoke:clean
