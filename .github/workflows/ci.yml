name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Verify Linux x64
        run: test "$(uname -s)" = Linux && test "$(uname -m)" = x86_64
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit public boundary
        run: bun run public:audit -- .
      - name: Validate generated metadata
        run: bun run version:check && bun run manifest:check && bun run template:check
      - name: Lint and typecheck
        run: bun run lint:biome && bun run lint:oxlint && bun run lint:knip && bun run typecheck
      - name: Test
        run: bun run test:full
      - name: Build and smoke
        run: bun run build && bun run release:provenance && bun run smoke:dist
      - name: Public example smoke
        run: bun run smoke:example

  windows:
    runs-on: windows-2025
    continue-on-error: true
    steps:
      - name: Checkout with Windows line-ending policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Verify native Windows x64
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne "Windows") { throw "Expected Windows runner" }
          bun -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate generated bytes and types
        run: bun run version:check && bun run manifest:check && bun run template:check && bun run typecheck
      - name: Run native Windows tests
        run: bun run test:full
      - name: Build and smoke native Windows artifact
        run: bun run build && bun run release:provenance && bun run smoke:dist
