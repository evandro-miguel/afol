name: agents-scaffold-ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      OSV_SCANNER_VERSION: "2.3.8"
      GITLEAKS_VERSION: "8.24.2"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Verify Ubuntu Linux x64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          grep -qi '^ID=ubuntu' /etc/os-release

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Rebuild local state
        run: ./afol local-state rebuild --json

      - name: Rebuild release health state
        shell: bash
        run: |
          set -euo pipefail
          ./afol pstr rebuild --json >/dev/null
          ./afol hydrate --all --json >/dev/null
          ./afol ctx build --json >/dev/null

      - name: Validate project
        run: ./afol validate project --json --check-drift

      - name: Release health
        run: ./afol health --release --json

      - name: Install pinned security scanners
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/security-tools"
          mkdir -p "$tool_dir"
          export GOBIN="$tool_dir"
          export GOPROXY="https://proxy.golang.org,direct"
          export GOSUMDB="sum.golang.org"
          go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@v${OSV_SCANNER_VERSION}"
          go install "github.com/zricethezav/gitleaks/v8@v${GITLEAKS_VERSION}"
          "$tool_dir/osv-scanner" --version
          "$tool_dir/gitleaks" version
          echo "AFOL_OSV_SCANNER_PATH=$tool_dir/osv-scanner" >> "$GITHUB_ENV"
          echo "AFOL_GITLEAKS_PATH=$tool_dir/gitleaks" >> "$GITHUB_ENV"

      - name: Release validation
        run: bun run validate:release

      - name: Clean checkout smoke
        run: bun run smoke:clean

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        with:
          name: afol-release-evidence
          retention-days: 3
          compression-level: 9
          path: |
            dist/afol
            dist/afol.sha256
            dist/afol.provenance.json
            dist/security-scan.release.json

  windows:
    runs-on: windows-2025

    steps:
      - name: Checkout with Windows line-ending policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Verify native Windows x64 runner
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne "Windows") { throw "Expected Windows runner" }
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne "X64") {
            throw "Expected Windows x64 runner"
          }
          bun -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated bytes and types
        run: |
          bun run version:check
          bun run manifest:check
          bun run validate:template
          bun run typecheck

      - name: Run native Windows tests
        run: bun run test:full

      - name: Build and smoke native Windows artifact
        run: |
          bun run build
          bun run smoke:dist
          bun run smoke:clean
