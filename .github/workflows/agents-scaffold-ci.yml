name: agents-scaffold-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: "2.3.8"
      GITLEAKS_VERSION: "8.24.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned security scanners
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/security-tools"
          mkdir -p "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"
          export GOBIN="$tool_dir"
          export GOPROXY="https://proxy.golang.org,direct"
          export GOSUMDB="sum.golang.org"
          go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@v${OSV_SCANNER_VERSION}"
          go install "github.com/gitleaks/gitleaks/v8@v${GITLEAKS_VERSION}"
          "$tool_dir/osv-scanner" --version
          "$tool_dir/gitleaks" version

      - name: Release validation
        run: bun run validate:release

      - name: Clean checkout smoke
        run: bun run smoke:clean

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: afol-release-evidence
          path: |
            dist/afol
            dist/afol.sha256
            dist/afol.provenance.json
