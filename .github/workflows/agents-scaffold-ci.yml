name: agents-scaffold-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release validation
        run: bun run validate:release

      - name: Clean checkout smoke
        run: bun run smoke:clean

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afol-release-evidence
          path: |
            dist/afol
            dist/afol.sha256
            dist/afol.provenance.json
